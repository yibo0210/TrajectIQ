[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajectiq"
version = "1.1.0"
description = "Agent regression diagnostics and release gates for Phoenix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api>=1.0",
  "opentelemetry-sdk>=1.0",
  "opentelemetry-exporter-otlp>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trajectiq = "trajectiq.run:main"
trajectiq-regression = "trajectiq.regression:main"
trajectiq-diagnose = "trajectiq.attribution:main"
trajectiq-gate = "trajectiq.gate:main"
trajectiq-dashboard-data = "trajectiq.dashboard_data:main"
trajectiq-trace-regression = "trajectiq.trace_io:main"
trajectiq-openai-demo = "trajectiq.openai_compatible:main"
trajectiq-mock-openai = "trajectiq.mock_openai:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectiq"]
include = ["src/trajectiq/datasets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
