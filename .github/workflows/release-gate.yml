name: TrajectIQ release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install TrajectIQ
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: python -m pytest tests -q
      - name: Evaluate release quality
        run: |
          mkdir -p reports
          trajectiq-gate --baseline baseline --candidate fixed --format markdown --output reports/release-gate.md
          cat reports/release-gate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release report
        uses: actions/upload-artifact@v4
        with:
          name: trajectiq-release-report
          path: reports/release-gate.md
          if-no-files-found: error
      - name: Update pull request summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- trajectiq-release-gate -->";
            const body = `${marker}\n${fs.readFileSync("reports/release-gate.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
